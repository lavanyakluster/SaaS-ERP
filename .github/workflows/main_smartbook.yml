name: Build and Deploy Next.js App to Azure Web App - smartbook

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # Step 3: Install dependencies and build Next.js app
      - name: Install dependencies and build
        run: |
          npm install --production
          npm run build

      # Step 4: Upload build artifact
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: |
            .next
            package.json
            package-lock.json
            public
            node_modules

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # Step 1: Download artifact from build job
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app

      # Step 2: Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_89C36C8CB03F45BF8C9399C8E44DFA96 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_95DC1A33973240A3BA47FAE2161EC84D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FB2B58CDEF07435D98DFBCFDD1BE1FCF }}

      # Step 3: Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'smartbook'
          slot-name: 'Production'
          package: .

